name: Deploy QLHVK1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: qlhvk1-production
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # JOB 1: Kiểm tra code thay đổi gì so với lần deploy thành công gần nhất
  # ---------------------------------------------------------------
  changes:
    name: Kiểm tra thay đổi
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      app: ${{ steps.check.outputs.app }}
      nginx: ${{ steps.check.outputs.nginx }}
      compose: ${{ steps.check.outputs.compose }}
    steps:
      - name: Lấy mã nguồn (đủ lịch sử để so sánh)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: So sánh với lần chạy thành công gần nhất trên main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -Eeuo pipefail

          # So với lần chạy thành công gần nhất (không phải commit liền trước),
          # nên deploy lỗi hoặc commit bị gộp hàng đợi vẫn được xét lại.
          previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')

          app=false
          nginx=false
          compose=false

          if [[ -z "$previous" ]] || ! git cat-file -e "$previous^{commit}" 2>/dev/null; then
            # Chưa có lần nào thành công -> deploy toàn bộ
            app=true; nginx=true; compose=true
          else
            while IFS= read -r file; do
              case "$file" in
                deploy/nginx/*)  nginx=true ;;
                docker-compose.yml) compose=true ;;
                src/*|Dockerfile|.dockerignore|deploy/scripts/*|deploy/seed/*|.github/workflows/deploy.yml)
                  app=true ;;
              esac
            done < <(git diff --name-only "$previous" "$GITHUB_SHA")
          fi

          # Chạy tay = muốn triển khai lại ứng dụng
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then app=true; fi

          deploy=false
          if [[ "$app" == true || "$nginx" == true || "$compose" == true ]]; then deploy=true; fi

          {
            echo "deploy=$deploy"
            echo "app=$app"
            echo "nginx=$nginx"
            echo "compose=$compose"
          } >> "$GITHUB_OUTPUT"

          echo "Ứng dụng: $app | Nginx: $nginx | Compose: $compose | Cần deploy: $deploy"

  # ---------------------------------------------------------------
  # JOB 2: Deploy lên server + gắn chứng chỉ SSL
  # ---------------------------------------------------------------
  deploy:
    name: Deploy lên server
    needs: changes
    if: needs.changes.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # Bước 1: chuẩn bị SSH. Host key được lấy trực tiếp từ server (ssh-keyscan),
      # không cần secret SSH_KNOWN_HOSTS.
      - name: Chuẩn bị kết nối SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          : "${SERVER_HOST:?Thiếu secret SERVER_HOST}"
          : "${SERVER_USER:?Thiếu secret SERVER_USER}"
          : "${SSH_PRIVATE_KEY:?Thiếu secret SSH_PRIVATE_KEY}"

          [[ "$SERVER_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] \
            || { echo "::error::SERVER_HOST chỉ được là IP hoặc hostname, không kèm user@ hay khoảng trắng"; exit 1; }
          [[ "$SERVER_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] \
            || { echo "::error::SERVER_USER không hợp lệ"; exit 1; }

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key

          ssh-keyscan -T 15 -t ed25519,rsa "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          [[ -s ~/.ssh/known_hosts ]] \
            || { echo "::error::Không lấy được host key từ $SERVER_HOST (sai IP, firewall chặn cổng 22, hoặc server tắt)"; exit 1; }

          cat > ~/.ssh/config <<EOF
          Host server
            HostName ${SERVER_HOST}
            User ${SERVER_USER}
            Port 22
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ServerAliveInterval 30
            ServerAliveCountMax 10
          EOF

          ssh server 'echo "Kết nối SSH thành công: $(hostname)"'

      # Bước 2: đóng gói source đã commit, gửi lên server và chạy deploy.sh
      - name: Gửi mã nguồn và triển khai
        env:
          INITIAL_DATA_KEY: ${{ secrets.INITIAL_DATA_KEY }}
          APP_CHANGED: ${{ needs.changes.outputs.app }}
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077

          deploy_id="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          remote="/opt/qlhvk1/incoming/${deploy_id}"

          temp=$(mktemp -d)
          trap 'rm -rf "$temp"' EXIT

          printf '%s' "$INITIAL_DATA_KEY" > "$temp/seed.key"
          # git archive chỉ lấy file đã commit, không lấy secret hay file tạm của runner
          git archive --format=tar.gz HEAD > "$temp/source.tar.gz"

          ssh server "umask 077; mkdir -p '$remote'; chmod 700 /opt/qlhvk1 '$remote'"
          scp "$temp/source.tar.gz" "$temp/seed.key" "server:$remote/"

          ssh server "bash -s -- '$deploy_id' '$APP_CHANGED'" <<'REMOTE'
          set -Eeuo pipefail
          umask 077
          deploy_id=$1
          app_changed=$2
          [[ "$deploy_id" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]] || exit 1
          incoming="/opt/qlhvk1/incoming/$deploy_id"
          release="/opt/qlhvk1/releases/$deploy_id"
          trap 'rm -rf "$incoming"' EXIT
          mkdir -p "$release"
          tar -xzf "$incoming/source.tar.gz" -C "$release"
          bash "$release/deploy/scripts/deploy.sh" "$app_changed" "$incoming/seed.key"
          REMOTE

      # Bước 3: chứng chỉ SSL bằng certbot --nginx (xin và tự gắn vào Nginx).
      # Chạy khi cấu hình Nginx vừa đổi (deploy có thể ghi đè phần SSL cũ)
      # hoặc khi domain chưa có chứng chỉ.
      - name: Xin và gắn chứng chỉ SSL (certbot --nginx)
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          NGINX_CHANGED: ${{ needs.changes.outputs.nginx }}
        shell: bash
        run: |
          set -Eeuo pipefail

          : "${DOMAIN:?Thiếu secret DOMAIN}"
          : "${CERTBOT_EMAIL:?Thiếu secret CERTBOT_EMAIL}"
          [[ "$DOMAIN" =~ ^[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?$ ]] \
            || { echo "::error::DOMAIN không hợp lệ"; exit 1; }
          [[ "$CERTBOT_EMAIL" =~ ^[^@[:space:]]+@[^@[:space:]]+$ ]] \
            || { echo "::error::CERTBOT_EMAIL không hợp lệ"; exit 1; }

          ssh server "bash -s -- '$DOMAIN' '$CERTBOT_EMAIL' '$NGINX_CHANGED'" <<'REMOTE'
          set -Eeuo pipefail
          domain=$1
          email=$2
          nginx_changed=$3

          if ! command -v certbot >/dev/null 2>&1; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -y
            apt-get install -y certbot python3-certbot-nginx
          fi

          if [[ "$nginx_changed" == true || ! -d "/etc/letsencrypt/live/$domain" ]]; then
            nginx -t
            certbot --nginx \
              -d "$domain" \
              -m "$email" \
              --agree-tos --no-eff-email \
              --non-interactive \
              --redirect \
              --keep-until-expiring
            nginx -t
            systemctl reload nginx
          else
            echo "Chứng chỉ của $domain đã có và Nginx không đổi, bỏ qua certbot."
          fi
          REMOTE
