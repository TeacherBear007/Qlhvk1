name: qlhvk1

services:
  qlhvk1:
    image: qlhvk1:${QLHV_IMAGE_TAG:-local}
    build:
      context: ${QLHV_BUILD_CONTEXT:-.}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8989:8989"
    environment:
      AllowedHosts: "qlhvk1.hoanganhplus01.io.vn;localhost;127.0.0.1"
      Deployment__NginxProxyIp: "172.28.89.1"
      Deployment__RequireInitializedData: "true"
    volumes:
      - type: bind
        source: /var/lib/qlhvk1/AppData
        target: /app/AppData
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:8989/health"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    logging:
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    ipam:
      config:
        - subnet: "172.28.89.0/24"
          gateway: "172.28.89.1"
